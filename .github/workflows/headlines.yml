name: Update headlines
on:
  schedule:
    - cron: '0 */3 * * *'   # every 3 hours UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch RSS
        run: |
          # Mountain Mail / BLOX rate-limits aggressively and 429s plain
          # curl UAs from cloud IPs. Pose as a real browser, retry on 429,
          # and back off — works in practice.
          curl --fail --max-time 30 \
               --retry 5 --retry-delay 8 --retry-all-errors \
               -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36" \
               -H "Accept: application/rss+xml, application/xml;q=0.9, */*;q=0.8" \
               -H "Accept-Language: en-US,en;q=0.9" \
               -H "Referer: https://www.themountainmail.com/" \
               "https://www.themountainmail.com/search/?q=&t=article&l=20&s=start_time&sd=desc&f=rss" \
               -o headlines.xml
          # Sanity check: the response must look like XML, not an HTML
          # bot-challenge page. Fail the job (don't commit garbage) if not.
          head -c 200 headlines.xml
          grep -q '<rss\|<\?xml' headlines.xml
      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add headlines.xml
          git diff --staged --quiet || git commit -m "Update headlines $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
