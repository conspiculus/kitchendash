name: Update headlines
on:
  schedule:
    - cron: '0 */3 * * *'   # every 3 hours UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install curl-impersonate
        run: |
          # Plain curl gets 429'd by Cloudflare regardless of headers because
          # CF fingerprints the TLS handshake (JA3). curl-impersonate mimics
          # Chrome's full TLS/HTTP-2 fingerprint and slips through.
          set -e
          mkdir -p .ci
          curl -fsSL -o .ci/ci.tar.gz \
            https://github.com/lwthiker/curl-impersonate/releases/download/v0.6.1/curl-impersonate-v0.6.1.x86_64-linux-gnu.tar.gz
          mkdir -p .ci/ci
          tar -xzf .ci/ci.tar.gz -C .ci/ci
          ls .ci/ci

      - name: Fetch RSS
        run: |
          set -e
          URL="https://www.themountainmail.com/search/?q=&t=article&l=20&s=start_time&sd=desc&f=rss"

          # Cloudflare's rate-limit window for the runner IP regularly
          # outlasts a fixed 10s retry budget, so curl --retry-delay would
          # burn through all attempts inside one CF window. Exponential
          # backoff with jitter: 20s, 40s, 80s, 160s between attempts.
          delay=20
          for attempt in 1 2 3 4 5; do
            echo "Attempt $attempt"
            if .ci/ci/curl_chrome116 --fail --max-time 30 \
                -H "Referer: https://www.themountainmail.com/" \
                -H "Accept: application/rss+xml, application/xml;q=0.9, */*;q=0.8" \
                "$URL" -o headlines.xml; then
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "All attempts failed"
              exit 1
            fi
            jitter=$((RANDOM % 10))
            sleep $((delay + jitter))
            delay=$((delay * 2))
          done

          echo "--- size ---"
          wc -c headlines.xml
          echo "--- first 400 bytes ---"
          head -c 400 headlines.xml; echo
          grep -q '<rss\|<?xml' headlines.xml

      - name: Clean up downloader
        if: always()
        run: rm -rf .ci
      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add headlines.xml
          git diff --staged --quiet || git commit -m "Update headlines $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
